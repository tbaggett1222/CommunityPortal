<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>communityportal</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          max-width: 760px;
          margin: 40px auto;
          border: 1px solid #ef4444;
          border-radius: 10px;
          padding: 16px 18px;
          font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
          background: #fef2f2;
          color: #7f1d1d;
          line-height: 1.5;
        "
      >
        CommunityPortal needs JavaScript enabled to render.
      </div>
    </noscript>
    <script>
      ;(() => {
        const root = document.getElementById('root')
        if (!root) return

        const startupHelp = [
          'If this is GitHub Pages, set Settings -> Pages -> Source to "GitHub Actions" so the built dist files are deployed.',
          'Then rerun the "Deploy to GitHub Pages" workflow and hard refresh.',
        ]

        const showFallback = (headline, detail) => {
          if (root.childElementCount > 0 || root.textContent?.trim()) return
          root.innerHTML = `
            <section style="max-width:760px;margin:40px auto;border:1px solid #f59e0b;border-radius:10px;padding:16px 18px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fffbeb;color:#78350f;line-height:1.55;">
              <h1 style="margin:0 0 8px;font-size:20px;">${headline}</h1>
              <p style="margin:0 0 10px;">${detail}</p>
              <ul style="margin:0;padding-left:20px;">
                ${startupHelp.map((item) => `<li>${item}</li>`).join('')}
              </ul>
            </section>
          `
        }

        window.addEventListener(
          'error',
          (event) => {
            const target = event.target
            if (target && target.tagName === 'SCRIPT') {
              showFallback(
                'CommunityPortal script failed to load.',
                'A required JavaScript file could not be loaded by the browser.',
              )
            }
          },
          true,
        )

        setTimeout(() => {
          showFallback(
            'CommunityPortal did not start.',
            'The page loaded, but the app did not mount in time.',
          )
        }, 3000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
